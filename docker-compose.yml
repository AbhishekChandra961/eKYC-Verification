# eKYC stack. Settings and secrets come from .env (copy .env.example).
#
# Default (Phase 6): only the INFRASTRUCTURE: Kafka (KRaft), Kafka UI, MongoDB, an S3-compatible store.
#   docker compose up -d                  the services then run on the host: scripts/run_all.sh (lightweight mode)
# Profile "app" (Phase 9): ALSO the application in containers: api, orchestrator, the 4 workers and the frontend.
#   docker compose --profile app up -d --build     -> frontend http://localhost:3000, API http://localhost:8000
#   docker compose --profile app down              (volumes are kept; never use -v unless you want to lose the data)
# Ollama always stays on the host (no GPU inside Docker on macOS): containers reach it at host.docker.internal:11434.
# Run EITHER the host services (run_all.sh) OR the app profile, not both: they share port 8000 and consumer groups.
#
# Images (pinned; all multi-arch with arm64 builds, checked on Docker Hub 2026-11-17):
#   apache/kafka 4.4.0      official Apache image, KRaft mode (no ZooKeeper)
#   kafbat/kafka-ui v1.5.0  maintained fork of provectus kafka-ui (which has had no release since 2024)
#   mongo 8.0               official image
#   rustfs/rustfs 1.0.6     S3-compatible store (Apache-2.0). MinIO's community Docker images stopped in
#                           Oct 2025 and the project was archived in 2026, so it is no longer an option.
# Memory: Kafka heap 512 MB, MongoDB cache 0.25 GB, every container capped. Measured in Phase 9 (reports/phase9/docker.md):
# infra alone ~0.9 GB idle; with the app profile ~2.3 GB idle and ~3.3 GB at peak (forgery worker 1.33 GB while scoring).
# Docker Desktop's default 4 GB VM ran OUT of memory with the app profile: give it 6 GB (Settings > Resources), or use
# the lightweight host mode (scripts/run_all.sh) on a 16 GB Mac where Ollama also needs 6-8 GB.

name: ekyc

x-logging: &small-logs  # keep container logs from filling the disk
  driver: json-file
  options: {max-size: "10m", max-file: "2"}

# ---------------------------------------------------------------- shared settings of the app containers (profile "app")
x-app: &app
  profiles: ["app"]
  restart: unless-stopped
  logging: *small-logs
  extra_hosts: ["host.docker.internal:host-gateway"]  # Docker Desktop has it built in; this also covers Linux
  depends_on: &app-deps
    kafka: {condition: service_healthy}
    mongo: {condition: service_healthy}
    s3: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}
    s3-init: {condition: service_completed_successfully}

# Connection settings inside the Docker network (the host services use localhost and the EXTERNAL Kafka listener).
# Each service gets only what it needs (never the whole .env): workers have no MongoDB credentials, the orchestrator
# no S3 credentials, and only the API has the JWT secret.
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: kafka:9092
x-mongo-env: &mongo-env
  MONGO_HOST: mongo:27017
  MONGO_DB: ${MONGO_DB:-ekyc}
  MONGO_ROOT_USER: ${MONGO_ROOT_USER}
  MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
x-s3-env: &s3-env
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-kyc-uploads}
  S3_REGION: ${S3_REGION:-us-east-1}

x-python-build: &python-build
  context: .
  dockerfile: services/Dockerfile

x-worker: &worker
  <<: *app
  image: ekyc-worker:0.9.0
  build: {<<: *python-build, target: worker}
  environment:
    <<: [*kafka-env, *s3-env]
    OLLAMA_HOST: http://host.docker.internal:11434  # used by the extraction worker
  volumes: ["./models:/app/models:ro"]  # weights mounted read-only, never baked into the image

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: ekyc-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  # one node does both jobs (fine for development)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:9092); EXTERNAL: the workers on the host (localhost:9094)
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics only from kafka-init: a typo in a topic name fails loudly
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # a single broker can only hold one copy
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The node's broker part must heartbeat its own controller part; the default 9 s lease made it fence itself
      # (consumer-offset partitions offline, "Waiting for coordinator") whenever the Docker VM stalled under host
      # memory pressure. 60 s rides out such stalls on a single-node development broker.
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 60000
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP:-512m} -Xmx${KAFKA_HEAP:-512m}
    ports: ["9094:9094"]
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 1g
    healthcheck:  # the broker answers on its internal listener
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *small-logs

  kafka-init:  # one-shot: creates the topics (from CLAUDE.md), 3 partitions each; safe to run again
    image: apache/kafka:4.4.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
      TOPICS: kyc.submitted kyc.tasks.doc kyc.tasks.forgery kyc.tasks.face kyc.tasks.extraction kyc.results kyc.decided kyc.dlq
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in $$TOPICS; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    logging: *small-logs

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: ekyc-kafka-ui
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: ekyc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
    ports: ["8080:8080"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *small-logs

  mongo:
    image: mongo:8.0
    container_name: ekyc-mongo
    command: ["--wiredTigerCacheSizeGB", "0.25"]  # default would take half the container's RAM
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    mem_limit: 1g  # Phase 9: at 768m the mongosh healthcheck was OOM-killed inside the limit (measured peak 766 MiB)
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *small-logs

  s3:
    image: rustfs/rustfs:1.0.6
    container_name: ekyc-s3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports: ["9000:9000", "9001:9001"]  # 9000 S3 API, 9001 web console
    volumes: [s3-data:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null || wget -qO- http://localhost:9000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *small-logs

  s3-init:  # one-shot: creates the upload bucket (S3 "CreateBucket", signed with AWS SigV4); safe to run again
    image: curlimages/curl:8.23.0
    depends_on:
      s3: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-kyc-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /tmp/out -w '%{http_code}' -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
          --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
          "http://s3:9000/$$S3_BUCKET")
        echo "CreateBucket $$S3_BUCKET -> HTTP $$code"; cat /tmp/out; echo
        case "$$code" in 200|409) exit 0;; *) exit 1;; esac
    restart: "no"
    logging: *small-logs

  # ---------------------------------------------------------------- the application (profile "app", Phase 9)
  api:
    <<: *app
    image: ekyc-api:0.9.0
    container_name: ekyc-api
    build: {<<: *python-build, target: api}
    environment:
      <<: [*kafka-env, *mongo-env, *s3-env]
      # presigned image links are opened by the BROWSER: they must name the host's address of the S3 store
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      API_MAX_UPLOAD_MB: ${API_MAX_UPLOAD_MB:-10}
      API_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL:-}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-}
      DEMO_OFFICER_EMAIL: ${DEMO_OFFICER_EMAIL:-}
      DEMO_OFFICER_PASSWORD: ${DEMO_OFFICER_PASSWORD:-}
    ports: ["8000:8000"]
    mem_limit: 384m

  orchestrator:
    <<: *app
    image: ekyc-orchestrator:0.9.0
    container_name: ekyc-orchestrator
    build: {<<: *python-build, target: orchestrator}
    environment:
      <<: [*kafka-env, *mongo-env]
      ORCHESTRATOR_LLM_NOTE: "false"
    volumes: ["./models:/app/models:ro"]  # the decision thresholds are read from models/*.json
    mem_limit: 256m

  doc-worker:
    <<: *worker
    container_name: ekyc-doc-worker
    command: ["python", "services/doc-worker/main.py"]
    mem_limit: 1g

  forgery-worker:
    <<: *worker
    container_name: ekyc-forgery-worker
    command: ["python", "services/forgery-worker/main.py"]
    mem_limit: 2g  # measured: 1.33 GB resident while scoring one page's ~88 tiles

  face-worker:
    <<: *worker
    container_name: ekyc-face-worker
    command: ["python", "services/face-worker/main.py"]
    mem_limit: 1g  # measured peak 634 MiB

  extraction-worker:
    <<: *worker
    container_name: ekyc-extraction-worker
    command: ["python", "services/extraction-worker/main.py"]
    mem_limit: 512m
    healthcheck:  # one extraction may wait 3 x 180 s for Ollama (timeout per attempt): a longer heartbeat limit
      test: ["CMD", "python", "-m", "ekyc.messaging.health", "900"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  frontend:
    <<: *app
    image: ekyc-frontend:0.9.0
    container_name: ekyc-frontend
    build: {context: frontend}
    depends_on: [api]
    environment:
      EKYC_API_URL: http://localhost:8000  # the address the BROWSER uses for the API (written to /config.js)
    ports: ["3000:8080"]
    mem_limit: 64m

volumes:
  kafka-data:
  mongo-data:
  s3-data:
