# Continuous integration (Phase 9): lint + unit tests for the Python code and the frontend, on every push and pull
# request. No secrets: the jobs use .env.example's values (blank passwords) and never start the Docker stack.
#
# Tests that need things CI does not have carry pytest markers and are deselected (see pyproject.toml):
#   services  the running docker-compose stack (MongoDB, Kafka): the API and orchestrator tests
#   models    trained weights / downloaded model files in models/ (gitignored; only the small *.json configs are in git)
#   data      SIDTD / LFW data and the processed caches in data/ (gitignored, ~30 GB)
# Locally, `pytest` runs everything (those tests skip themselves when their files or services are missing).

name: CI

on:
  push:
    branches: [main, "Phase*"]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Settings (no secrets needed)
        run: cp .env.example .env
      - name: Install (Linux requirements, plain TensorFlow 2.18.1 CPU; versions pinned by requirements.txt)
        run: pip install -r requirements-ci.txt -c requirements.txt
      - name: Lint (ruff)
        run: ruff check
      - name: Tests without services, model weights or data
        run: python -m pytest -m "not services and not models and not data" -p no:cacheprovider
        env:
          PYTHONPATH: src  # the ekyc package, without installing it
          TF_CPP_MIN_LOG_LEVEL: "2"

  frontend:
    name: Frontend (ESLint + TypeScript + Vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (exactly package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint, incl. React hooks and jsx-a11y)
        run: npm run lint
      - name: Typecheck (tsc, strict)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
